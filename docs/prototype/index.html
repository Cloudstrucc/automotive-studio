<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autoline Admin Prototype</title>
<link rel="stylesheet" href="vendor/bootstrap.min.css">
<link rel="stylesheet" href="vendor/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand"><i></i>Autoline Admin</div>

    <div class="card">
      <div class="card-body p-4">
        <h1 class="h5 fw-bold mb-1">Sign in</h1>
        <p class="text-muted-2 mb-4">We'll email you a link. No password to remember.</p>

        <label class="form-label fw-semibold">Email address</label>
        <input type="email" class="form-control mb-3" placeholder="you@example.com" value="client@example.com">

        <a href="dashboard.html" class="btn btn-accent w-100 mb-3">Email me a sign-in link</a>

        <div class="alert alert-light border small mb-0">
          <i class="bi bi-info-circle me-1"></i>
          Access is invite-only. If you don't have an account, ask an admin for an
          invitation link.
        </div>
      </div>
    </div>

    <p class="text-center mt-3 mb-0">
      <a href="accept.html" class="text-decoration-none small" style="color:#94a3b8">
        Have an invitation code? Redeem it →
      </a>
    </p>
  </div>
</div>
</body>
</html>
