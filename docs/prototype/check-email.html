<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check your email — Autoline Admin</title>
<link rel="stylesheet" href="vendor/bootstrap.min.css">
<link rel="stylesheet" href="vendor/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand"><i></i>Autoline Admin</div>
    <div class="card">
      <div class="card-body p-4 text-center">
        <div class="mb-3" style="font-size:40px;color:var(--al-accent)">
          <i class="bi bi-envelope-check"></i>
        </div>
        <h1 class="h5 fw-bold mb-2">Check your email</h1>
        <p class="text-muted-2 mb-4">
          We sent a sign-in link to <strong>newadmin@example.com</strong>.
          It's good for 15 minutes.
        </p>
        <a href="dashboard.html" class="btn btn-accent w-100 mb-2">
          Simulate clicking the link →
        </a>
        <p class="small text-muted-2 mb-0">Didn't get it? Check spam, or resend in 0:42.</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
