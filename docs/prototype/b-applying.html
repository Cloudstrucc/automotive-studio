<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Applying — Autoline Workspace</title>
<link rel="stylesheet" href="vendor/bootstrap.min.css">
<link rel="stylesheet" href="vendor/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="b.css">
</head>
<body class="b-body">
<div class="b-bar"><div class="b-bar-in">
  <a class="b-brand text-decoration-none text-reset" href="b-workspace.html"><i></i>Autoline</a>
  <div class="ms-auto d-flex align-items-center gap-2">
    <span class="b-chip b-chip-ok"><i class="bi bi-plug-fill"></i> GitHub connected</span>
    <span class="b-chip"><i class="bi bi-person-circle"></i> client@example.com</span>
  </div>
</div></div>
<div class="b-wrap">
  <div class="b-crumbs"><a href="b-workspace.html">Workspace</a> / Applying</div>

  <h1 class="mb-1" style="font-family:Archivo,sans-serif;font-weight:800;font-size:30px">Applying your change</h1>
  <p class="b-dim mb-4">This takes about a minute. You can leave this page open.</p>

  <div class="b-card" style="max-width:620px">
    <div class="b-card-b">
      <div class="b-step done"><div class="b-dot"><i class="bi bi-check"></i></div>
        <div class="flex-fill fw-semibold">Photo uploaded</div>
        <div class="b-dim small">1 file</div></div>
      <div class="b-step done"><div class="b-dot"><i class="bi bi-check"></i></div>
        <div class="flex-fill fw-semibold">Saved to the repository</div>
        <div class="b-dim small font-monospace">a3f91c2</div></div>
      <div class="b-step now"><div class="b-dot"><div class="spinner-border spinner-border-sm" style="width:11px;height:11px;color:#19e36a"></div></div>
        <div class="flex-fill fw-semibold">Drawing the ad</div>
        <div class="b-dim small">3 formats</div></div>
      <div class="b-step todo"><div class="b-dot"></div>
        <div class="flex-fill">Building the preview site</div></div>

      <div class="b-bar-track mt-3 mb-3"><div class="b-bar-fill" style="width:58%"></div></div>

      <div class="d-flex gap-2">
        <a href="b-preview.html" class="b-btn">Simulate completion <i class="bi bi-arrow-right"></i></a>
        <a href="b-workspace.html" class="b-ghost-btn">Leave it running</a>
      </div>
    </div>
  </div>

</div>
</body>
</html>
