<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Redeem invitation — Autoline Admin</title>
<link rel="stylesheet" href="vendor/bootstrap.min.css">
<link rel="stylesheet" href="vendor/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand"><i></i>Autoline Admin</div>

    <div class="card">
      <div class="card-body p-4">
        <h1 class="h5 fw-bold mb-1">You've been invited</h1>
        <p class="text-muted-2 mb-4">
          Invited by <strong>fred@cloudstrucc.com</strong> · expires in 6 days
        </p>

        <label class="form-label fw-semibold">Invitation code</label>
        <input class="form-control mb-1 font-monospace" value="qT7dK2p9-Lm4xR8vN1wZ" readonly>
        <p class="small text-muted-2 mb-3">
          <i class="bi bi-check-circle-fill text-success me-1"></i>
          Filled in from your link. You can also paste it yourself.
        </p>

        <label class="form-label fw-semibold">Your email</label>
        <input type="email" class="form-control mb-3" value="newadmin@example.com">

        <a href="check-email.html" class="btn btn-accent w-100">Accept invitation</a>
      </div>
    </div>

    <p class="text-center small mt-3 mb-0" style="color:#64748b">
      This code works once and expires 7 days after it was created.
    </p>
  </div>
</div>
</body>
</html>
