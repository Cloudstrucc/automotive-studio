<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autoline Workspace</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0a0e14; --panel:#11161f; --panel2:#0d1219; --ink:#eef2f6; --soft:#9fb0c2;
  --dim:#6f8295; --line:#1e2731; --acc:#19e36a; --acc-ink:#04140a; --warn:#f5a623;
  --cond:"Archivo","Arial Narrow",sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  background:radial-gradient(120% 70% at 85% -10%,#16202e 0%,rgba(10,14,20,0) 55%),var(--bg);
  color:var(--ink);font-family:"Inter",-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
a{color:inherit}
h1,h2{font-family:var(--cond);font-weight:800;margin:0}

.bar{position:sticky;top:0;z-index:30;background:rgba(10,14,20,.88);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1000px;margin:0 auto;padding:13px 20px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--cond);font-weight:800;
  text-transform:uppercase;font-size:16px;cursor:pointer}
.brand i{width:13px;height:13px;background:var(--acc);clip-path:polygon(0 0,100% 0,65% 100%,0 100%)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--soft);
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap}
.chip.ok{color:var(--acc);border-color:rgba(25,227,106,.34)}
.chip.warn{color:var(--warn);border-color:rgba(245,166,35,.34)}

.wrap{max-width:1000px;margin:0 auto;padding:24px 20px 70px}
.crumbs{font-size:12.5px;color:var(--dim);margin-bottom:10px}
.crumbs b{color:var(--soft);cursor:pointer;font-weight:500}
.crumbs b:hover{color:var(--acc)}

.eyebrow{font-family:var(--cond);font-weight:700;letter-spacing:.3em;text-transform:uppercase;
  color:var(--acc);font-size:11.5px;margin:0 0 11px}
h1{font-size:clamp(26px,4.4vw,38px)}
.lede{color:var(--soft);max-width:60ch;margin:12px 0 0}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px;margin:26px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:19px;
  cursor:pointer;transition:border-color .13s,transform .13s;text-align:left;color:inherit;font:inherit;width:100%}
.tile:hover{border-color:var(--acc);transform:translateY(-2px)}
.tile .mk{width:38px;height:38px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;margin-bottom:13px;
  font-family:var(--cond);font-weight:800;color:var(--acc);font-size:15px}
.tile h2{font-size:17px;text-transform:uppercase}
.tile p{color:var(--soft);font-size:13px;margin:4px 0 0}
.tile .go{color:var(--acc);font-size:11.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;margin-top:13px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.card-h{padding:12px 17px;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px}
.card-b{padding:17px}

label.lab{font-family:var(--cond);font-size:10.5px;text-transform:uppercase;letter-spacing:.13em;
  color:var(--soft);font-weight:700;display:block;margin-bottom:6px}
input.in,textarea.in,select.in{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  color:var(--ink);padding:10px 13px;font-size:14px;font-family:inherit}
input.in:focus,textarea.in:focus,select.in:focus{outline:none;border-color:var(--acc)}
textarea.in{resize:vertical;min-height:100px}
input.in::placeholder,textarea.in::placeholder{color:#55657a}
input.in.missing,select.in.missing{border-color:var(--warn)}
.tile .st{float:right;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:var(--warn);background:rgba(245,166,35,.13);padding:3px 7px;border-radius:4px}
.toggle{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--soft);cursor:pointer}
.toggle input{accent-color:var(--acc);width:16px;height:16px}

.btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:9px;background:var(--acc);
  color:var(--acc-ink);font-weight:700;font-size:14px;padding:11px 19px;cursor:pointer;font-family:inherit}
.btn:hover:not(:disabled){background:#15c55c}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--soft);font-weight:600}
.btn.ghost:hover:not(:disabled){color:var(--acc);border-color:var(--acc);background:transparent}

.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:9px}
.act{display:flex;align-items:center;gap:9px;padding:13px 15px;border-radius:10px;background:var(--panel2);
  border:1px solid var(--line);cursor:pointer;font-size:14px;font-weight:600;color:var(--ink);
  font-family:inherit;text-align:left}
.act:hover:not(:disabled){border-color:var(--acc)}
.act.sel{border-color:var(--acc);background:rgba(25,227,106,.09)}
.act:disabled{opacity:.42;cursor:not-allowed}
.act small{display:block;color:var(--dim);font-weight:500;font-size:11.5px}

.drop{border:1px dashed #2a3747;border-radius:11px;padding:22px;text-align:center;color:var(--soft);
  background:var(--panel2);cursor:pointer}
.drop:hover{border-color:var(--acc)}
.thumbs{display:flex;gap:9px;flex-wrap:wrap;margin-top:11px}
.thumb{position:relative;width:84px;height:64px;border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.72);color:#fff;border:0;
  border-radius:4px;width:19px;height:19px;cursor:pointer;font-size:12px;line-height:1}

.sum{background:rgba(25,227,106,.08);border:1px solid rgba(25,227,106,.3);border-radius:11px;
  padding:15px 17px;margin-bottom:16px}
.fld{display:flex;gap:10px;align-items:center;margin-bottom:9px;flex-wrap:wrap}
.fld .lab{margin:0;flex:0 0 96px}
.fld .in{flex:1;min-width:150px}
.tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--warn);
  background:rgba(245,166,35,.13);padding:3px 7px;border-radius:4px;white-space:nowrap}

pre.payload{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:14px;
  overflow-x:auto;font-size:12px;line-height:1.5;color:var(--soft);margin:0}
.note{background:rgba(245,166,35,.09);border:1px solid rgba(245,166,35,.32);border-radius:10px;
  padding:13px 16px;font-size:13.5px;color:#f0c478;margin-bottom:16px}
.note b{color:var(--warn)}
.dim{color:var(--dim)}
.row{display:flex;align-items:center;gap:11px;padding:12px 17px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.pick{cursor:pointer;border-radius:7px;margin:-5px -8px;padding:5px 8px}
.pick:hover{background:var(--panel2)}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);
  border-radius:50%;display:inline-block;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none}
@media(max-width:620px){
  .bar-in .chip.who{display:none}
  .wrap{padding:18px 15px 60px}
  .fld .lab{flex:0 0 100%}
}
</style>
</head>
<body>

<div class="bar"><div class="bar-in">
  <div class="brand" onclick="go('workspace')"><i></i>Autoline</div>
  <div style="margin-left:auto;display:flex;gap:7px;align-items:center">
    <span class="chip" id="capChip"><span class="spin"></span> starting</span>
    <span class="chip who" id="whoChip"></span>
  </div>
</div></div>

<div class="wrap" id="view"></div>

<script>
'use strict';

/* ---------- configuration ---------- */
const TARGET_ENV = 'development';
const SITE = 'https://cloudstrucc.github.io/automotive-studio';
const TARGET_URL = `${SITE}/${TARGET_ENV}/`;

/* The route shape, which has to match build.py exactly (see docs/CATEGORIES.md).
   The default category IS the environment: its board is <env>/ and its items stay
   under <env>/cars/, so there is no /vehicles/ route and no old link broke. Every
   other category gets its own folder, board and item pages together. */
const DEFAULT_CATALOGUE = 'vehicles';
const itemUrl = (slug, cat) => {
  const c = cat || S.cat?.slug || DEFAULT_CATALOGUE;
  const dir = c === DEFAULT_CATALOGUE ? 'cars' : encodeURIComponent(c);
  return `${SITE}/${TARGET_ENV}/${dir}/${encodeURIComponent(slug)}.html`;
};
/* Folders the generated site already writes at an environment root, so a category
   cannot have one as its slug. build.py refuses these too. */
const RESERVED_ROUTES = ['ads', 'assets', 'cars', 'production', 'review', 'development'];

/* Where items whose category was deleted are parked. Not a category: no manifest, no
   route, no menu entry, nothing on the site. It exists so a deletion never destroys
   anything -- the items wait here until they are given a category again. */
const ORPHAN_CATALOGUE = 'orphan';

/* A category's three states. draft and retired both render nothing; they are kept
   apart because they read differently in this list -- not launched yet, versus we
   stopped selling it. */
const CAT_STATES = [
  ['public',  'On the site', 'Its page is live'],
  ['draft',   'Draft',       'Not on the site yet'],
  ['retired', 'Retired',     'Taken off the site, kept here'],
];

/* An item is on the site or it is not: one off-the-site state, reached either by
   saving a draft or by deactivating something that was live. docs/CATEGORIES.md says
   why there is no third spelling. */
const ITEM_STATES = [
  ['published', 'Put it on the site', 'Visible as soon as the site rebuilds'],
  ['draft',     'Save as a draft',    'Kept here, nothing published'],
];

const slugify = s => String(s || '').trim().toLowerCase()
  .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

/* Catalogues are repository data: <env>/manifests/catalogues/<slug>.json. That is what
   lets the client add one without a deploy. This list is only what the tiles show
   before the listing arrives, or if reading it fails.
   Only what actually exists is listed, so a category can never be offered as a place
   to put something when there is no manifest behind it. */
const FALLBACK_CATALOGUES = [
  { slug:'vehicles', label:'Vehicles', mark:'VE', specs:['KM','Engine','Drivetrain'],
    order:1, status:'public', in_menu:true, heading:'The Lineup', lede:'' },
];
const catalogues = () => (S.cats?.length ? S.cats : FALLBACK_CATALOGUES);

/* The tiles on the workspace: every category, plus the orphan pen while it holds
   anything. The pen is never a place you can put something, so it is kept out of
   catalogues() and only added here. */
const orphanCount = () => (S.items?.[ORPHAN_CATALOGUE]?.length || 0);
const ORPHAN_TILE = {
  slug: ORPHAN_CATALOGUE, label: 'Needs a category', mark: '?',
  specs: ['Spec 1', 'Spec 2', 'Spec 3'], order: 9999,
  status: 'draft', in_menu: false, heading: 'Needs a category', lede: '', _orphan: true,
};
const tiles = () => orphanCount() ? [...catalogues(), ORPHAN_TILE] : catalogues();

/* A catalogue manifest carries spec_slots:[{label}]; the views want three plain
   strings, so normalise on the way in. */
function asCatalogue(m){
  const specs = (m.spec_slots || []).map(s => s?.label).filter(Boolean);
  while (specs.length < 3) specs.push('Spec ' + (specs.length + 1));
  return {
    slug: m.slug, label: m.label || m.slug, mark: (m.mark || m.slug.slice(0,2)).toUpperCase(),
    specs: specs.slice(0,3), order: m.order ?? 99, _path: m._path,
    // "published" is the spelling from before a category had three states
    status: m.status === 'published' ? 'public' : (m.status || 'public'),
    in_menu: m.in_menu !== false,
    heading: m.heading || m.label || m.slug,
    lede: m.lede || '',
  };
}

const onSite = c => c.status === 'public';
const catState = s => CAT_STATES.find(x => x[0] === s) || CAT_STATES[1];

const ACTIONS = [
  { id:'add',     label:'Add an item',      hint:'Describe it, I fill the fields', ready:true  },
  { id:'price',   label:'Change a price',   hint:'Next pass',                      ready:false },
  { id:'photos',  label:'Update photos',    hint:'Next pass',                      ready:false },
  { id:'sold',    label:'Mark as sold',     hint:'Next pass',                      ready:false },
];

/* The shape the model must return. Also what we validate against before rendering. */
const PLAN_SHAPE = `{
  "summary": "one sentence describing the change",
  "fields": {
    "title":    "string or null",
    "subtitle": "string or null",
    "year":     "string or null",
    "price":    "string or null, digits and commas only, no $",
    "eyebrow":  "string or null, a short badge like Certified",
    "specs": [ { "label": "string", "value": "string or null" } ]
  }
}`;

/* ---------- state ---------- */
const S = {
  view:'workspace', cat:null, action:'add',
  text:'', photos:[],           // {id,url,name}
  plan:null, busy:false, error:null,
  ready:true, drafts:[],
  publishing:false, published:null,
  me:null,                      // {email} from the Access assertion
  items:null,                   // {catalogue: [item]} from the repository
  cats:null,                    // [catalogue] from <env>/manifests/catalogues/
  loadingItems:false, itemsError:null,
  editing:null,                 // the item being edited, when not a new one
  confirmDelete:null,
  shared:null,                  // slug whose link was just copied
  newCat:null,                  // the catalogue being created
  editCat:null,                 // the catalogue being edited, as a draft of its fields
  confirmCatDelete:false,
  itemCat:'',                   // the category the item on screen will be saved into
  itemStatus:'published',       // whether saving it puts it on the site
};

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Views take a catalogue object; callers pass its slug. */
function go(v, slug){
  if (slug !== undefined) S.cat = tiles().find(c => c.slug === slug) || null;
  S.view = v; S.error = null; S.shared = null; render();
}

/* Served same-origin by the Worker, so there is no capability handshake and no
   sandbox: /api/plan and /write are ordinary fetches to our own origin. */
function boot(){
  paint();
  loadDrafts();
  loadMe();
  loadItems();
}

async function loadMe(){
  try {
    const r = await fetch('/api/me');
    const d = await r.json();
    if (d?.ok) { S.me = d; paint(); }
  } catch {}
}

/* The repository is the source of truth; this reads it rather than keeping a copy,
   so the admin always shows what is actually committed. */
async function loadItems(){
  S.loadingItems = true; S.itemsError = null; render();
  try {
    const r = await fetch(`/api/items?env=${encodeURIComponent(TARGET_ENV)}`);
    const d = await r.json();
    if (!r.ok || !d.ok) throw new Error(d.error || `listing returned ${r.status}`);
    S.items = d.catalogues || {};
    const defs = (d.catalogueDefs || []).map(asCatalogue);
    if (defs.length) S.cats = defs;
    // the open catalogue may have been renamed or removed under us
    if (S.cat) S.cat = tiles().find(c => c.slug === S.cat.slug) || S.cat;
  } catch (e) {
    S.itemsError = e?.message || 'could not read the catalogue';
    S.items = null;
  }
  S.loadingItems = false; render();
}

function paint(){
  const chip = $('#capChip'), who = $('#whoChip');
  chip.className = 'chip ok';
  chip.textContent = 'Preview site';
  if (S.me?.email){
    who.classList.remove('hide');
    who.textContent = S.me.email;
    who.style.cursor = 'pointer';
    who.title = 'Profile and sign out';
    who.onclick = () => go('me');
  } else {
    who.classList.add('hide');
  }
  render();
}

const DRAFT_KEY = 'autoline.drafts';
function loadDrafts(){
  try { S.drafts = JSON.parse(localStorage.getItem(DRAFT_KEY) || '[]'); }
  catch { S.drafts = []; }
  render();
}
function storeDraft(entry){
  try {
    const kept = S.drafts.filter(d => d.id !== entry.id);
    S.drafts = [entry, ...kept].slice(0, 20);
    localStorage.setItem(DRAFT_KEY, JSON.stringify(S.drafts));
  } catch {}
}

/* ---------- photos ----------
   Resized before anything else: the ad generator composites into at most 1920px, so a
   phone's 12MP original is wasted bytes, and a smaller file keeps the eventual commit
   comfortably inside the endpoint's payload ceiling. Bytes stay in the page until
   publish -- there is no asset store to round-trip through any more. */
const MAX_EDGE = 1600;
function resize(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let { width:w, height:h } = img;
      const scale = Math.min(1, MAX_EDGE / Math.max(w, h));
      w = Math.round(w*scale); h = Math.round(h*scale);
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      cv.toBlob(b => b ? res(b) : rej(new Error('could not encode image')), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('could not read that image')); };
    img.src = url;
  });
}

function blobToB64(blob){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = () => rej(new Error('could not encode photo'));
    r.readAsDataURL(blob);
  });
}

async function addPhotos(files){
  S.busy = true; S.error = null; render();
  for (const f of files){
    try {
      const blob = await resize(f);
      S.photos.push({
        name: f.name,
        url: URL.createObjectURL(blob),
        b64: await blobToB64(blob),
      });
    } catch (e) {
      S.error = 'Could not add ' + f.name + ': ' + (e?.message || 'failed');
    }
  }
  S.busy = false; render();
}

/* ---------- the assistant ----------
   The model never writes anything. The Worker calls Anthropic with its own key,
   validates the shape, and returns a plan the page renders as an editable form. */
async function askForPlan(){
  if (!S.text.trim()){ S.error='Describe the item first.'; return render(); }
  S.busy = true; S.error = null; render();
  try {
    const res = await fetch('/api/plan', {
      method:'POST',
      headers:{ 'content-type':'application/json' },
      body: JSON.stringify({
        description: S.text.trim(),
        catalogue: S.cat.label,
        slots: S.cat.specs,
      }),
    });
    const out = await res.json().catch(() => ({}));
    if (!res.ok || !out.ok) throw new Error(out.error || out.detail || `assistant returned ${res.status}`);
    S.plan = out.plan;
    S.view = 'plan';
  } catch (e) {
    S.error = 'Could not read a plan from that description: ' + (e?.message || 'unknown error');
  }
  S.busy = false; render();
}

/* ---------- the commit ----------
   One manifest plus any new photos. An edit keeps the item's slug, order and kicker,
   and keeps its existing photos unless new ones replace them.

   The category and the on-the-site choice are both explicit, held in S.itemCat and
   S.itemStatus: nothing is published by the mere act of writing it, and an item that
   has no category cannot be published at all. Moving an item to another category
   rewrites its manifest in the new folder and deletes the old one, in one commit. */
function buildPayload(){
  const f = S.plan.fields;
  const e = S.editing;
  const cat = S.itemCat || '';
  const slug = e ? e.slug : slugify(f.title || 'item');
  const [make, ...rest] = String(f.title || '').trim().split(/\s+/);
  const manifest = {
    schema: 1, slug, catalogue: cat,
    status: S.itemStatus === 'published' ? 'published' : 'draft',
    order: e?.order ?? 99,
    make: make || null, model: rest.join(' ') || null,
    subtitle: f.subtitle, year: f.year, price: f.price,
    eyebrow: f.eyebrow,
    kicker: e?.kicker ?? null,
    specs: f.specs.filter(s => s.value),
    // keep the existing photos when an edit does not replace them. Photos already
    // committed keep their paths -- a change of category moves the manifest, not the
    // files it points at.
    images: S.photos.length
      ? S.photos.map((p,i) => ({
          file: `source-photos/${cat || 'items'}/${slug}/${i+1}.jpg`,
          role: i ? 'secondary' : 'primary',
        }))
      : (e?.images || []),
    ...(e?.background && !S.photos.length ? { background: e.background } : {}),
    audit: { updated_at: new Date().toISOString() },
  };
  const path = `${TARGET_ENV}/manifests/items/${cat || '<category>'}/${slug}.json`;
  return {
    files: [
      { path, contents: manifest },
      ...S.photos.map((p,i) => ({
        path:`${TARGET_ENV}/source-photos/${cat || 'items'}/${slug}/${i+1}.jpg`, b64:p.b64 })),
    ],
    // the old manifest goes in the same commit, so the item is never in two places
    deletes: (e?._path && e._path !== path) ? [e._path] : [],
    message: `${e ? 'Update' : 'Add'} ${f.year || ''} ${f.title || slug}`.replace(/\s+/g,' ').trim()
             + ` in ${TARGET_ENV}`,
  };
}

/* The spec slots belong to the category, so choosing a different one re-labels them
   and keeps whatever values were typed. */
function pickCategory(slug){
  S.itemCat = slug || '';
  const dest = catalogues().find(c => c.slug === S.itemCat);
  if (dest && S.plan?.fields?.specs){
    S.plan.fields.specs = dest.specs.map((label, i) => ({
      label, value: S.plan.fields.specs[i]?.value ?? null,
    }));
  }
  S.error = null; render();
}

function editItem(slug){
  const list = (S.items?.[S.cat.slug]) || [];
  const it = list.find(x => x.slug === slug);
  if (!it) return;
  S.editing = it;
  S.photos = [];                       // existing photos stay unless replaced
  // an orphaned item arrives with no category, and must be given one before it can
  // go back on the site
  S.itemCat = (it.catalogue && it.catalogue !== ORPHAN_CATALOGUE) ? it.catalogue : '';
  S.itemStatus = it.status === 'published' ? 'published' : 'draft';
  S.plan = {
    summary: `Update ${it.year || ''} ${it.make || ''} ${it.model || ''}`.replace(/\s+/g,' ').trim(),
    fields: {
      title: [it.make, it.model].filter(Boolean).join(' ') || null,
      subtitle: it.subtitle ?? null,
      year: it.year ?? null,
      price: it.price ?? null,
      eyebrow: it.eyebrow ?? null,
      specs: (catalogues().find(c => c.slug === S.itemCat)?.specs || S.cat.specs)
        .map((label, i) => ({
          label: it.specs?.[i]?.label || label,
          value: it.specs?.[i]?.value ?? null,
        })),
    },
  };
  go('plan');
}

async function deleteItem(slug){
  const list = (S.items?.[S.cat.slug]) || [];
  const it = list.find(x => x.slug === slug);
  if (!it) return;
  S.publishing = true; S.error = null; render();
  try {
    // The manifest and its photos go; CI rebuilds <env>/ads from what remains, so
    // the rendered ads disappear without being deleted by hand.
    const deletes = [it._path, ...(it.images || []).map(i => `${TARGET_ENV}/${i.file}`)];
    if (it.background) deletes.push(`${TARGET_ENV}/${it.background}`);
    const res = await fetch('/write', {
      method:'POST',
      headers:{ 'content-type':'application/json' },
      body: JSON.stringify({ message:`Remove ${it.slug} from ${TARGET_ENV}`, files: [], deletes }),
    });
    const out = await res.json().catch(() => ({}));
    if (!res.ok || !out.ok) throw new Error(out.error || `endpoint returned ${res.status}`);
    S.confirmDelete = null;
    await loadItems();
  } catch (e) {
    S.error = 'Could not remove it: ' + (e?.message || 'unknown error');
  }
  S.publishing = false; render();
}

/* ---------- deactivate / activate ----------
   The generator only renders an item when its status is "published", so flipping the
   status is all it takes to pull something off the site. Nothing is deleted: the
   manifest and its photos stay, so activating it again brings the item back as it was.

   This is the same draft state "Save as a draft" writes at creation -- one way to be
   off the site, reached from either end. */
async function setStatus(slug, status){
  const it = (S.items?.[S.cat.slug] || []).find(x => x.slug === slug);
  if (!it) return;
  const { _path, _catalogue, _broken, ...manifest } = it;
  manifest.status = status;
  manifest.audit = { ...(manifest.audit || {}), updated_at: new Date().toISOString() };
  const name = [it.year, it.make, it.model].filter(Boolean).join(' ') || slug;

  S.publishing = true; S.error = null; render();
  try {
    await write({
      message: `${status === 'published' ? 'Activate' : 'Deactivate'} ${name} in ${TARGET_ENV}`,
      files: [{ path: _path, contentsBase64: b64(JSON.stringify(manifest, null, 2)) }],
    });
    await loadItems();
  } catch (e) {
    S.error = `Could not ${status === 'published' ? 'activate' : 'deactivate'} it: `
            + (e?.message || 'unknown error');
  }
  S.publishing = false; render();
}

/* ---------- share ----------
   Each published item has its own page on the preview site. Copy rather than open:
   a link you can paste into a message is the thing worth having. */
async function shareItem(slug, cat){
  const url = itemUrl(slug, cat);
  if (await copy(url)) {
    S.shared = slug; S.error = null;
    setTimeout(() => { if (S.shared === slug){ S.shared = null; render(); } }, 4000);
  } else {
    S.shared = null;
    S.error = 'Could not reach the clipboard. The link is ' + url;
  }
  render();
}

/* execCommand first: it runs inside the click that called us, so it works where the
   async clipboard API is still waiting on a permission the viewer has not granted. */
async function copy(text){
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    if (ok) return true;
  } catch {}
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  return false;
}

/* ---------- catalogues ----------
   A catalogue is a manifest like any other, so adding one is a commit, not a deploy. */
function startCatalogue(){
  S.newCat = { label:'', specs:['','',''], heading:'', lede:'',
               status:'public', in_menu:true };
  go('newcat');
}

/* Everything a category manifest holds that the admin lets you set. Shared by create
   and edit so the two can never drift apart. */
function catManifest(slug, c, order, existing){
  return {
    schema: 1, slug,
    status: c.status || 'public',
    // a category can be public but kept out of the site's menu, reachable only by
    // direct link. build.py reads this as the sitemap flag.
    in_menu: c.in_menu !== false,
    label: (c.label || slug).trim(),
    mark: (c.mark || slug.slice(0,2)).toUpperCase(),
    order,
    heading: (c.heading || c.label || slug).trim(),
    lede: (c.lede || '').trim() || null,
    spec_slots: c.specs.map(s => ({ label: (s || '').trim() })),
    audit: { ...(existing?.audit || {}), updated_at: new Date().toISOString() },
  };
}

/* The checks create and edit share: a name, three slots, and a slug the site can
   actually serve from. */
function catProblem(c, slug, { isNew }){
  if (!(c.label || '').trim())          return 'Give the category a name.';
  if (!/^[a-z][a-z0-9-]*$/.test(slug))  return 'That name has no letters I can make a folder from.';
  if (RESERVED_ROUTES.includes(slug))   return `"${slug}" is a folder the site already uses. Pick another name.`;
  if (slug === ORPHAN_CATALOGUE)        return `"${slug}" is reserved for items whose category was deleted.`;
  if (isNew && catalogues().some(x => x.slug === slug)) return `There is already a ${c.label} category.`;
  if (c.specs.map(s => (s || '').trim()).filter(Boolean).length !== 3)
    return 'Three spec slots, please — that is what the ad artwork draws.';
  return null;
}

async function createCatalogue(){
  const c = S.newCat;
  const label = (c.label || '').trim();
  const slug = slugify(label);
  const problem = catProblem(c, slug, { isNew:true });
  if (problem) { S.error = problem; return render(); }

  const order = Math.max(0, ...catalogues().map(x => x.order ?? 0)) + 1;
  const manifest = catManifest(slug, c, order);

  S.publishing = true; S.error = null; render();
  try {
    await write({
      message: `Add the ${label} catalogue to ${TARGET_ENV}`,
      files: [{
        path: `${TARGET_ENV}/manifests/catalogues/${slug}.json`,
        contentsBase64: b64(JSON.stringify(manifest, null, 2)),
      }],
    });
    // open the new catalogue from the manifest we just wrote rather than waiting for
    // the listing to catch up -- GitHub's tree is not read-your-writes
    S.cat = asCatalogue(manifest);
    S.newCat = null; S.error = null;
    await loadItems();
    S.view = 'catalogue';
  } catch (e) {
    S.error = 'Could not create it: ' + (e?.message || 'unknown error');
  }
  S.publishing = false; render();
}

/* ---------- editing a category ----------
   Everything but the slug. The slug is the folder every item manifest and photo of
   this category sits in, so changing it would be a move of the whole category rather
   than an edit, and this does not pretend otherwise. */
function startEditCatalogue(){
  const c = S.cat;
  S.editCat = {
    slug: c.slug, label: c.label, mark: c.mark, heading: c.heading, lede: c.lede,
    specs: [...c.specs], status: c.status, in_menu: c.in_menu,
    order: c.order, _path: c._path,
  };
  S.confirmCatDelete = false;
  go('editcat');
}

async function saveCatalogue(){
  const c = S.editCat;
  const problem = catProblem(c, c.slug, { isNew:false });
  if (problem) { S.error = problem; return render(); }

  const existing = (S.cats || []).find(x => x.slug === c.slug);
  const manifest = catManifest(c.slug, c, c.order ?? 99, existing);
  const path = c._path || `${TARGET_ENV}/manifests/catalogues/${c.slug}.json`;

  S.publishing = true; S.error = null; render();
  try {
    await write({
      message: `Update the ${manifest.label} catalogue in ${TARGET_ENV}`,
      files: [{ path, contentsBase64: b64(JSON.stringify(manifest, null, 2)) }],
    });
    S.cat = asCatalogue({ ...manifest, _path: path });
    S.editCat = null;
    await loadItems();
    S.view = 'catalogue';
  } catch (e) {
    S.error = 'Could not save it: ' + (e?.message || 'unknown error');
  }
  S.publishing = false; render();
}

/* ---------- deleting a category ----------
   Its items are not destroyed. Each one is rewritten into the orphan pen -- its
   catalogue field changed, its status dropped to draft, where it came from recorded --
   and its old manifest deleted, all in the one commit that removes the category. So
   the repository is never half-updated: either the category is gone and its items are
   waiting to be reassigned, or nothing happened. */
async function deleteCatalogue(){
  const c = S.editCat || S.cat;
  const held = (S.items?.[c.slug] || []);
  const path = c._path || `${TARGET_ENV}/manifests/catalogues/${c.slug}.json`;

  const files = [];
  const deletes = [path];
  for (const it of held){
    const { _path, _catalogue, _broken, ...m } = it;
    m.catalogue = ORPHAN_CATALOGUE;
    m.status = 'draft';                       // nothing in the pen is on the site
    m.audit = { ...(m.audit || {}), updated_at: new Date().toISOString(),
                orphaned_from: c.slug };
    files.push({
      path: `${TARGET_ENV}/manifests/items/${ORPHAN_CATALOGUE}/${m.slug}.json`,
      contentsBase64: b64(JSON.stringify(m, null, 2)),
    });
    if (_path) deletes.push(_path);
  }
  if (files.length > 39){
    S.error = `${c.label} holds ${files.length} items — too many to move in one commit. `
            + 'Reassign some of them first.';
    return render();
  }

  S.publishing = true; S.error = null; render();
  try {
    await write({
      message: held.length
        ? `Delete the ${c.label} catalogue from ${TARGET_ENV}, keeping its `
          + `${held.length} item${held.length===1?'':'s'}`
        : `Delete the empty ${c.label} catalogue from ${TARGET_ENV}`,
      files, deletes,
    });
    S.editCat = null; S.confirmCatDelete = false; S.cat = null;
    await loadItems();
    S.view = 'workspace';
  } catch (e) {
    S.error = 'Could not delete it: ' + (e?.message || 'unknown error');
  }
  S.publishing = false; render();
}

/* One same-origin POST to the commit endpoint, with the failure modes in one place. */
async function write(body){
  const res = await fetch('/write', {
    method:'POST',
    headers:{ 'content-type':'application/json' },
    body: JSON.stringify({ files: [], deletes: [], ...body }),
  });
  const out = await res.json().catch(() => ({}));
  if (!res.ok || !out.ok) throw new Error(out.error || `endpoint returned ${res.status}`);
  return out;
}

function saveDraft(){
  const payload = buildPayload();
  storeDraft({
    id: payload.files[0].contents.slug,
    catalogue: S.cat.slug,
    title: S.plan.fields.title,
    summary: S.plan.summary,
    savedAt: new Date().toISOString(),
  });
  S.view = 'result'; render();
}

/* One same-origin POST. The Worker holds the GitHub token and enforces the path
   allowlist; nothing secret passes through the browser. */
async function publish(){
  S.publishing = true; S.error = null; render();
  try {
    const p = buildPayload();
    const files = p.files.map(f => ({
      path: f.path,
      contentsBase64: f.b64 !== undefined ? f.b64 : b64(JSON.stringify(f.contents, null, 2)),
    }));
    const res = await fetch('/write', {
      method:'POST',
      headers:{ 'content-type':'application/json' },
      body: JSON.stringify({ message: p.message, files, deletes: p.deletes || [] }),
    });
    const out = await res.json().catch(() => ({}));
    if (!res.ok || !out.ok) throw new Error(out.error || `endpoint returned ${res.status}`);
    S.published = { commit: out.commit, at: new Date().toISOString(), catalogue: S.itemCat };
    loadItems();
  } catch (e) {
    S.error = 'Publish failed: ' + (e?.message || 'unknown error');
  }
  S.publishing = false; render();
}

function b64(str){
  const bytes = new TextEncoder().encode(str);
  let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}

function downloadPayload(){
  const p = buildPayload();
  const blob = new Blob([JSON.stringify(p, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = p.files[0].contents.slug + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

                   oninput="S.newCat.specs[${i}]=this.value">
          </div>`).join('')}
        <p class="dim" style="font-size:12.5px;margin:12px 0 0">
          Three labels, the same for every item in this category. Vehicles use
          KM &middot; Engine &middot; Drivetrain.
        </p>
      </div>
      ${catStateControls(c, 'S.newCat')}
    </div>

    <div style="display:flex;gap:9px">
      <button class="btn" onclick="createCatalogue()" ${S.publishing?'disabled':''}>
        ${S.publishing ? '<span class="spin"></span> Creating' : 'Create the category'}
      </button>
      <button class="btn ghost" onclick="S.newCat=null;go('workspace')">Cancel</button>
    </div>`;
}

function vEditCat(){
  const c = S.editCat || {};
  const held = (S.items?.[c.slug] || []).length;
  return `
    <div class="crumbs"><b onclick="go('workspace')">Workspace</b> /
      <b onclick="go('catalogue','${esc(c.slug)}')">${esc(c.label)}</b> / Settings</div>
    <h1>${esc(c.label)} settings</h1>
    <p class="lede">Everything but the folder name. <code>${esc(c.slug)}</code> is where
      this category&rsquo;s items and photos live in the repository, so it stays put.</p>

    ${S.error ? `<div class="note" style="margin-top:18px"><b>Problem.</b> ${esc(S.error)}</div>` : ''}

    <div class="card" style="margin-top:22px;max-width:620px">
      <div class="card-h">The category</div>
      <div class="card-b">
        <div class="fld">
          <label class="lab">Name</label>
          <input class="in" value="${esc(c.label)}" oninput="S.editCat.label=this.value">
        </div>
        <div class="fld">
          <label class="lab">Heading</label>
          <input class="in" value="${esc(c.heading)}" placeholder="shown above the list on the site"
                 oninput="S.editCat.heading=this.value">
        </div>
        <div class="fld">
          <label class="lab">Blurb</label>
          <input class="in" value="${esc(c.lede)}" placeholder="one line, optional"
                 oninput="S.editCat.lede=this.value">
        </div>
        <div class="fld">
          <label class="lab">Order</label>
          <input class="in" type="number" value="${esc(c.order ?? 99)}"
                 oninput="S.editCat.order=Number(this.value)||0">
        </div>
        <p class="dim" style="font-size:12.5px;margin:0">
          The heading and blurb are what the site prints at the top of this
          category&rsquo;s page. Order sets where it sits in the menu.
        </p>
      </div>
      ${catStateControls(c, 'S.editCat')}
    </div>

    <div class="card" style="max-width:620px">
      <div class="card-h">Spec slots</div>
      <div class="card-b">
        ${[0,1,2].map(i => `
          <div class="fld">
            <label class="lab">Slot ${i+1}</label>
            <input class="in ${c.specs?.[i]?'':'missing'}" value="${esc(c.specs?.[i])}"
                   oninput="S.editCat.specs[${i}]=this.value">
          </div>`).join('')}
        <p class="dim" style="font-size:12.5px;margin:12px 0 0">
          Renaming a slot changes the label the ads draw. Values already saved on each
          item stay where they are.
        </p>
      </div>
    </div>

    <div class="card" style="max-width:620px">
      <div class="card-h">Delete this category</div>
      <div class="card-b">
        <p class="dim" style="margin:0 0 13px">
          ${held
            ? `Its ${held} item${held===1?'':'s'} ${held===1?'is':'are'} not thrown away.
               ${held===1?'It is':'They are'} moved to <strong>Needs a category</strong>,
               taken off the site, and wait${held===1?'s':''} there until you give
               ${held===1?'it':'them'} a category again.`
            : 'It holds nothing, so only its own manifest goes.'}
        </p>
        ${S.confirmCatDelete
          ? `<div style="display:flex;gap:9px;flex-wrap:wrap;align-items:center">
               <span class="dim" style="font-size:12.5px">Delete ${esc(c.label)}?</span>
               <button class="btn ghost" onclick="S.confirmCatDelete=false;render()">Cancel</button>
               <button class="btn" style="background:#f5a623" onclick="deleteCatalogue()"
                       ${S.publishing?'disabled':''}>
                 ${S.publishing ? '<span class="spin"></span> Deleting' : 'Really delete it'}
               </button>
             </div>`
          : `<button class="btn ghost" onclick="S.confirmCatDelete=true;render()">
               Delete ${esc(c.label)}</button>`}
      </div>
    </div>

    <div style="display:flex;gap:9px;flex-wrap:wrap">
      <button class="btn" onclick="saveCatalogue()" ${S.publishing?'disabled':''}>
        ${S.publishing ? '<span class="spin"></span> Saving' : 'Save the category'}
      </button>
      <button class="btn ghost" onclick="S.editCat=null;go('catalogue','${esc(c.slug)}')">Cancel</button>
    </div>`;
}

function vMe(){
  return `
    <div class="crumbs"><b onclick="go('workspace')">Workspace</b> / Profile</div>
    <h1>Profile</h1>
    <div class="card" style="margin-top:22px;max-width:520px">
      <div class="card-b">
        <label class="lab">Signed in as</label>
        <div style="font-weight:600;margin-bottom:16px">${esc(S.me?.email || 'unknown')}</div>
        <label class="lab">Session</label>
        <div class="dim" style="margin-bottom:16px">
          ${S.me?.expires ? 'Expires ' + esc(new Date(S.me.expires).toLocaleString()) : 'Managed by Cloudflare Access'}
        </div>
        <label class="lab">Publishing to</label>
        <div class="dim">${esc(TARGET_ENV)} &middot;
          <a href="${TARGET_URL}" target="_blank" style="color:var(--acc)">view the preview site</a></div>
      </div>
    </div>
    <div style="display:flex;gap:9px;margin-top:18px">
      <a class="btn" href="/cdn-cgi/access/logout">Sign out</a>
      <button class="btn ghost" onclick="go('workspace')">Back</button>
    </div>`;
}

function vTask(){
  return `
    <div class="crumbs"><b onclick="go('workspace')">Workspace</b> /
      <b onclick="go('catalogue')">${esc(S.cat.label)}</b> / Add</div>
    <h1>Add to ${esc(S.cat.label)}</h1>
    <p class="lede">What would you like to do?</p>

    <div class="acts" style="margin:22px 0">
      ${ACTIONS.map(a => `
        <button class="act ${a.id===S.action?'sel':''}" ${a.ready?'':'disabled'}
                onclick="S.action='${a.id}';render()">
          <div>${esc(a.label)}<small>${esc(a.hint)}</small></div>
        </button>`).join('')}
    </div>

    <div class="card">
      <div class="card-h">Describe it</div>
      <div class="card-b">
        <label class="lab">In your own words</label>
        <textarea class="in" id="desc" placeholder="e.g. 2017 Santa Fe Sport, 2.4L, 107,000 km, heated seats, asking 14,000"
          oninput="S.text=this.value">${esc(S.text)}</textarea>
        <p class="dim" style="font-size:12.5px;margin:8px 0 0">
          Anything you don't mention is left blank for you to fill &mdash; never guessed.
        </p>
      </div>
    </div>

    <div class="card">
      <div class="card-h">Photos</div>
      <div class="card-b">
        <div class="drop" onclick="$('#file').click()">
          <div style="font-weight:600">Choose photos from this device</div>
          <div class="dim" style="font-size:12.5px">JPG or PNG &middot; resized here before upload</div>
        </div>
        <input id="file" type="file" accept="image/*" multiple class="hide"
               onchange="addPhotos([...this.files]);this.value=''">
        <div class="thumbs">
          ${S.photos.map((p,i) => `<div class="thumb">
            <img src="${esc(p.url)}" alt="">
            <button onclick="S.photos.splice(${i},1);render()" title="Remove">&times;</button>
          </div>`).join('')}
        </div>
      </div>
    </div>

    ${S.error ? `<div class="note"><b>Problem.</b> ${esc(S.error)}</div>` : ''}

    <div style="display:flex;gap:9px;margin-top:6px">
      <button class="btn" onclick="askForPlan()" ${S.busy?'disabled':''}>
        ${S.busy ? '<span class="spin"></span> Thinking' : 'Show me the plan'}
      </button>
      <button class="btn ghost" onclick="go('workspace')">Cancel</button>
    </div>`;
}

function vPlan(){
  const f = S.plan.fields;
  const row = (key, label, val) => `
    <div class="fld">
      <label class="lab">${esc(label)}</label>
      <input class="in ${val==null?'missing':''}" value="${esc(val)}"
             placeholder="not stated" oninput="S.plan.fields.${key}=this.value||null">
      ${val==null?'<span class="tag">needs you</span>':''}
    </div>`;
  return `
    <div class="crumbs"><b onclick="go('workspace')">Workspace</b> /
      <b onclick="go('catalogue')">${esc(S.cat.label)}</b> / ${S.editing ? 'Edit' : 'Review'}</div>
    <h1>${S.editing ? 'Edit ' + esc([S.editing.year, S.editing.make, S.editing.model].filter(Boolean).join(' ')) : "Here's what I'll do"}</h1>
    <p class="lede">${S.editing
      ? 'Change anything below, then publish. Existing photos are kept unless you add new ones.'
      : 'Nothing has been written. Edit anything below, then confirm.'}</p>

    <div class="sum" style="margin-top:20px">${esc(S.plan.summary)}</div>
    <p class="dim" style="font-size:12.5px;margin:0 0 14px">
      Publishing writes to the <strong>preview</strong> site, not the live one.
    </p>

    <div class="card">
      <div class="card-h">Where it goes</div>
      <div class="card-b">
        <div class="fld">
          <label class="lab">Category</label>
          <select class="in ${S.itemCat?'':'missing'}" onchange="pickCategory(this.value)">
            <option value="">&mdash; choose one &mdash;</option>
            ${catalogues().map(c => `<option value="${esc(c.slug)}"
                ${c.slug===S.itemCat?'selected':''}>${esc(c.label)}</option>`).join('')}
          </select>
          ${S.itemCat?'':'<span class="tag">needs you</span>'}
        </div>
        <p class="dim" style="font-size:12.5px;margin:0 0 15px">
          ${S.itemCat
            ? 'The spec slots below are this category&rsquo;s.'
            : 'An item has to belong to a category before it can go on the site.'}
        </p>
        <label class="lab">When you publish</label>
        <div class="acts">
          ${ITEM_STATES.map(([id, label, hint]) => `
            <button class="act ${S.itemStatus===id?'sel':''}"
                    onclick="S.itemStatus='${id}';render()">
              <div>${esc(label)}<small>${esc(hint)}</small></div>
            </button>`).join('')}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-h">Fields</div>
      <div class="card-b">
        ${row('title','Title',f.title)}
        ${row('subtitle','Subtitle',f.subtitle)}
        ${row('year','Year',f.year)}
        ${row('price','Price',f.price)}
        ${row('eyebrow','Badge',f.eyebrow)}
        <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
        <label class="lab">Spec slots</label>
        ${f.specs.map((s,i) => `
          <div class="fld">
            <label class="lab">${esc(s.label)}</label>
            <input class="in ${s.value==null?'missing':''}" value="${esc(s.value)}"
                   placeholder="not stated" oninput="S.plan.fields.specs[${i}].value=this.value||null">
            ${s.value==null?'<span class="tag">needs you</span>':''}
          </div>`).join('')}
        <p class="dim" style="font-size:12.5px;margin:12px 0 0">
          Blank fields are ones your description didn't cover. Three slots is the ceiling &mdash;
          that is what the ad artwork draws.
        </p>
      </div>
    </div>

    ${S.error ? `<div class="note"><b>Problem.</b> ${esc(S.error)}</div>` : ''}

    <div style="display:flex;gap:9px">
      <button class="btn" onclick="saveDraft()">Looks right &mdash; continue</button>
      <button class="btn ghost" onclick="go('task')">Back</button>
    </div>`;
}

function vResult(){
  const p = buildPayload();
  if (S.published){
    return `
      <div class="crumbs"><b onclick="go('workspace')">Workspace</b> / Published</div>
      <div class="card" style="max-width:580px;margin-top:20px">
        <div class="card-b" style="text-align:center;padding:32px">
          <div style="font-size:42px;color:var(--acc);line-height:1">&#10003;</div>
          <h1 style="font-size:24px;margin:12px 0 8px">${S.itemStatus === 'published' ? "It's live" : 'Saved'}</h1>
          <p class="dim" style="margin:0 0 6px">Commit
            <span style="font-family:ui-monospace,Menlo,monospace">${esc(S.published.commit.slice(0,7))}</span>,
            on the <strong>preview</strong> site. Rebuilds in about a minute.</p>
          <div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:18px">
            <a class="btn" target="_blank" rel="noopener"
               href="${itemUrl(p.files[0].contents.slug, S.published.catalogue)}">View this item</a>
            <button class="btn ghost"
                    onclick="shareItem('${esc(p.files[0].contents.slug)}','${esc(S.published.catalogue || '')}')">
              ${S.shared ? 'Link copied' : 'Copy its link'}
            </button>
            <button class="btn ghost" onclick="S.plan=null;S.published=null;S.text='';S.photos=[];S.editing=null;S.shared=null;S.itemCat='';S.itemStatus='published';go('workspace')">
              Make another change
            </button>
          </div>
        </div>
      </div>`;
  }
  const dest = catalogues().find(c => c.slug === S.itemCat);
  const noPhoto = !(S.photos.length || S.editing?.images?.length);
  const draft = p.files[0].contents.status !== 'published';
  return `
    <div class="crumbs"><b onclick="go('workspace')">Workspace</b> / Ready to publish</div>
    <h1>Ready to publish</h1>
    <p class="lede">Your draft is saved. This is exactly what will be committed.</p>

    ${dest ? '' : `<div class="note" style="margin-top:20px">
      <b>No category chosen.</b> Pick one on the previous screen &mdash; an item has to
      belong to a category before it can be written.
    </div>`}

    ${draft ? `<div class="note" style="margin-top:20px">
      <b>Saving this as a draft.</b> It is written to the repository but stays off the
      site${dest ? `. Activate it from the ${esc(dest.label)} list when you want it live` : ''}.
    </div>` : ''}

    ${noPhoto ? `<div class="note" style="margin-top:20px">
      <b>This item has no photo.</b> A published item needs at least one &mdash; the ad
      is built from it, so without a photo there is nothing to show. Go back and add one.
    </div>` : ''}

    <div class="card" style="margin-top:20px">
      <div class="card-h">The commit</div>
      <div class="card-b">
        ${p.files.map(f => `<div style="font-family:ui-monospace,Menlo,monospace;font-size:12.5px;
          padding:5px 0;border-bottom:1px solid var(--line)">
          <span style="color:var(--acc)">+</span> ${esc(f.path)}
          ${f.b64!==undefined?'<span class="dim"> (photo)</span>':''}
        </div>`).join('')}
        ${(p.deletes || []).map(d => `<div style="font-family:ui-monospace,Menlo,monospace;font-size:12.5px;
          padding:5px 0;border-bottom:1px solid var(--line)">
          <span style="color:var(--warn)">&minus;</span> ${esc(d)}
          <span class="dim"> (moved, not lost)</span>
        </div>`).join('')}
      </div>
    </div>

    <div class="card">
      <div class="card-h">Payload</div>
      <div class="card-b"><pre class="payload">${esc(JSON.stringify(p, null, 2))}</pre></div>
    </div>

    ${S.error ? `<div class="note"><b>Problem.</b> ${esc(S.error)}</div>` : ''}

    <div style="display:flex;gap:9px;flex-wrap:wrap">
      <button class="btn" onclick="publish()"
              ${S.publishing || !dest || (noPhoto && !draft) ? 'disabled' : ''}>
        ${S.publishing ? '<span class="spin"></span> Publishing'
          : draft ? 'Save the draft' : 'Publish to the preview site'}
      </button>
      <button class="btn ghost" onclick="downloadPayload()">Save the payload</button>
      <button class="btn ghost" onclick="S.plan=null;S.text='';S.photos=[];S.editing=null;go('workspace')">
        Discard
      </button>
    </div>`;
}

function render(){
  if (!S.ready){ $('#view').innerHTML = '<p class="dim" style="padding:40px 0">Starting…</p>'; return; }
  // these views all read S.cat; a catalogue that has gone away must not take the app down
  if (!S.cat && ['catalogue','task','plan','result'].includes(S.view)) S.view = 'workspace';
  if (!S.editCat && S.view === 'editcat') S.view = 'workspace';
  const v = S.view==='workspace' ? vWorkspace()
          : S.view==='catalogue' ? vCatalogue()
          : S.view==='newcat'    ? vNewCat()
          : S.view==='editcat'   ? vEditCat()
          : S.view==='me'        ? vMe()
          : S.view==='task'      ? vTask()
          : S.view==='plan'      ? vPlan()
          : vResult();
  $('#view').innerHTML = v;
}

render();
boot();
</script>
</body>
</html>
